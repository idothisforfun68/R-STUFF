<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: #94d2bd; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: white; }

        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 40px;
            text-align: center;
        }

        /* Massive Search Bar */
        .mega-search {
            position: relative;
            max-width: 900px;
            margin: 0 auto 60px auto;
        }

        .mega-search input {
            width: 100%;
            padding: 25px 35px;
            padding-left: 70px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            color: white;
            font-size: 1.4rem;
            outline: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .mega-search input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #94d2bd;
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .mega-search i {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: #94d2bd;
            opacity: 0.8;
        }

        /* Game Cards */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            padding-bottom: 100px;
        }

        .game-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: #94d2bd;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.5);
        }

        .game-thumbnail {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-info {
            padding: 20px;
            text-align: left;
        }

        .game-title {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .game-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94d2bd;
            opacity: 0.7;
        }

        .footer-info {
            padding: 40px;
            opacity: 0.4;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ProjectNEON</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="play.html" style="color: white;">Games</a>
            <a href="settings.html">Settings</a>
        </div>
    </nav>

    <div class="container">
        <div class="mega-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="gameSearch" placeholder="What are we playing today?" onkeyup="searchGames()">
        </div>

        <div class="game-grid" id="gameGrid">
            </div>
    </div>

    <div class="footer-info">
        &copy; 2026 ProjectNEON | Oscar REALLY made this
    </div>

    <script>
        // Fetch and load games from games.json
        async function loadGames() {
            try {
                const response = await fetch('games.json');
                const games = await response.json();
                const grid = document.getElementById('gameGrid');
                grid.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('a');
                    card.href = game.url;
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${game.image}" class="game-thumbnail" onerror="this.src='https://via.placeholder.com/300x200/111/94d2bd?text=${game.title}'">
                        <div class="game-info">
                            <span class="game-title">${game.title}</span>
                            <span class="game-category">${game.category || 'Game'}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading games:", err);
            }
        }

        function searchGames() {
            let input = document.getElementById('gameSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('.game-title').innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }

        window.onload = function() {
            loadGames();

            // Apply custom background from settings
            const customBg = localStorage.getItem('customBg');
            if(customBg) {
                document.body.style.backgroundImage = `url(${customBg})`;
            }

            // Apply Theme if no custom background
            const savedTheme = localStorage.getItem('selectedTheme');
            if (!customBg && savedTheme) {
                const themes = {
                    original: 'linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%)',
                    amethyst: 'linear-gradient(130deg, #240046 0%, #3c096c 25%, #5a189a 50%, #7b2cbf 75%, #240046 100%)',
                    amoled: 'linear-gradient(130deg, #000000 0%, #050505 50%, #111111 100%)'
                };
                if(themes[savedTheme]) document.body.style.background = themes[savedTheme];
            }
        };
    </script>
</body>
</html>
