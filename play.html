<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        /* Nav Bar */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 30px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 18px 35px; border-radius: 15px; font-weight: 900; font-size: 28px; min-width: 120px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 18px 40px; border-radius: 60px; display: flex; gap: 30px; font-size: 28px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); }

        /* Search Bar */
        .search-container { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        #search-input { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 12px 30px; border-radius: 30px; width: 400px; 
            font-size: 18px; text-align: center; outline: none; transition: 0.3s;
        }
        #search-input:focus { border-color: #5865f2; background: rgba(255,255,255,0.1); }

        /* Game Grid */
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; padding: 0 50px 50px 50px; justify-items: center;
        }
        .game-card {
            width: 180px; height: 180px; background: #111; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .game-card:hover { transform: translateY(-10px); border-color: #c2f9bb; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-title { position: absolute; bottom: 0; background: rgba(0,0,0,0.7); width: 100%; text-align: center; padding: 5px 0; font-size: 14px; }
        
        h1 { font-size: 50px; margin-bottom: 10px; color: #c2f9bb; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" style="color: #c2f9bb;"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="search-container">
        <h1>Games</h1>
        <input type="text" id="search-input" placeholder="Search for a game..." onkeyup="filterGames()">
    </div>

    <div class="game-grid" id="game-container">
        </div>

    <script>
        // --- 1. CLOCK SCRIPT ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. GENERATE 100+ GAMES ---
        const container = document.getElementById('game-container');
        const gameNames = [
            "Slope", "Tunnel Rush", "1v1.lol", "Retro Bowl", "Bitlife", "Roblox", "Minecraft", 
            "Among Us", "Subway Surfers", "Temple Run", "Angry Birds", "Flappy Bird", "Doodle Jump",
            "Jetpack Joyride", "Cut the Rope", "Fruit Ninja", "Crossy Road", "Pac-Man", "Tetris", "Snake"
        ];

        // This loop creates 100 cards using the names above or placeholders
        for (let i = 1; i <= 100; i++) {
            const name = gameNames[i-1] || `Game ${i}`;
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => window.location.href = `go.html?gameurl=${name.toLowerCase().replace(/\s+/g, '-')}`;
            card.innerHTML = `
                <img src="https://via.placeholder.com/180/222/fff?text=${name}" alt="${name}">
                <div class="game-title">${name}</div>
            `;
            container.appendChild(card);
        }

        // --- 3. SEARCH FILTER LOGIC ---
        function filterGames() {
            const input = document.getElementById('search-input').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');
            
            for (let card of cards) {
                const title = card.querySelector('.game-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "flex"; // Show
                } else {
                    card.style.display = "none"; // Hide
                }
            }
        }

        // --- 4. PARTICLE SCRIPT ---
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function init() {
            stars = [];
            for (let i = 0; i < 150; i++) { stars.push(new Star()); }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize(); init(); animate();
    </script>
</body>
</html>
