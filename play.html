<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: black; color: white; margin: 0; 
            font-family: 'Segoe UI', sans-serif; overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding-top: 120px;
        }
        
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        #fps-counter { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 20; }

        /* Bigger Nav & Clock */
        .top-nav-container { position: fixed; top: 30px; display: flex; align-items: center; gap: 25px; z-index: 100; }
        .clock-box { 
            background: rgba(255,255,255,0.15); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 24px; backdrop-filter: blur(10px);
        }
        .nav-dock { 
            background: rgba(255,255,255,0.15); padding: 15px 45px; border-radius: 60px; 
            display: flex; gap: 35px; font-size: 32px; backdrop-filter: blur(10px);
        }
        .nav-dock a { color: white; text-decoration: none; transition: 0.3s; }
        .nav-dock a:hover { transform: scale(1.25); color: #c2f9bb; }
        .active-nav { color: #88ff88 !important; }

        /* Game Grid & Hover Effects */
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 30px; width: 90%; max-width: 1200px; padding: 40px 0; 
        }
        .game-card { 
            position: relative; border-radius: 15px; overflow: hidden; 
            aspect-ratio: 1 / 1; cursor: pointer; transition: 0.4s;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-card:hover { transform: scale(1.1); border-color: #88ff88; box-shadow: 0 0 20px rgba(136, 255, 136, 0.3); }
        
        .game-info {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s; font-weight: bold; font-size: 20px; text-align: center; padding: 10px;
        }
        .game-card:hover .game-info { opacity: 1; }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-nav-container">
        <div class="clock-box" id="clock">00:00 PM</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" class="active-nav"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="game-grid">
        <div class="game-card" onclick="openGame('https://rawg.io/')">
            <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.png" alt="Minecraft">
            <div class="game-info">Minecraft Classic</div>
        </div>
        <div class="game-card" onclick="openGame('https://1v1.lol')">
            <img src="https://play-lh.googleusercontent.com/vHqLhW-7l9-8t3LqD9H5Y9Y9j5j5" alt="1v1.lol" onerror="this.src='https://via.placeholder.com/200?text=1v1.LOL'">
            <div class="game-info">1v1.LOL</div>
        </div>
        <div class="game-card" onclick="openGame('https://bitlifeonline.io')">
            <img src="https://play-lh.googleusercontent.com/699-M-20vA9j9" alt="Bitlife" onerror="this.src='https://via.placeholder.com/200?text=BitLife'">
            <div class="game-info">BitLife</div>
        </div>
        <div class="game-card" onclick="openGame('https://slopegame.online')">
            <img src="https://play-lh.googleusercontent.com/u7Y9W-20vA9j9" alt="Slope" onerror="this.src='https://via.placeholder.com/200?text=Slope'">
            <div class="game-info">Slope</div>
        </div>
    </div>

    <script>
        // FPS Counter
        const fpsDisplay = document.getElementById('fps-counter');
        let times = [];
        function calculateFPS() {
            window.requestAnimationFrame(() => {
                const now = performance.now();
                while (times.length > 0 && times[0] <= now - 1000) times.shift();
                times.push(now);
                fpsDisplay.innerText = `FPS: ${times.length}`;
                calculateFPS();
            });
        }
        calculateFPS();

        // Exact Clock
        function updateClock() {
            const now = new Date();
            let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // Game Opener Logic
        function openGame(url) {
            const proxy = localStorage.getItem('proxy') || 'static';
            // In a real setup, you'd route through your chosen proxy worker here
            window.location.href = url;
        }

        // Star & Rain Engines (Same as index.html)
        const rainCanvas = document.getElementById('rain');
        if (localStorage.getItem('rain') === 'enabled') {
            const rCtx = rainCanvas.getContext('2d');
            let drops = [];
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;
            class Drop {
                constructor() { this.init(); }
                init() { this.x = Math.random()*rainCanvas.width; this.y = Math.random()*-rainCanvas.height; this.speed = Math.random()*10+10; this.len = Math.random()*20+10; }
                update() { this.y += this.speed; if (this.y > rainCanvas.height) this.init(); }
                draw() { rCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; rCtx.lineWidth = 1; rCtx.beginPath(); rCtx.moveTo(this.x, this.y); rCtx.lineTo(this.x, this.y+this.len); rCtx.stroke(); }
            }
            for (let i = 0; i < 100; i++) drops.push(new Drop());
            function animateRain() { rCtx.clearRect(0,0,rainCanvas.width,rainCanvas.height); drops.forEach(d => { d.update(); d.draw(); }); requestAnimationFrame(animateRain); }
            animateRain();
        }

        const starCanvas = document.getElementById('stars');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];
        if (localStorage.getItem('particles') !== 'disabled') {
            starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight;
            class Star {
                constructor() { this.x = Math.random()*starCanvas.width; this.y = Math.random()*starCanvas.height; this.size = Math.random()*1.5; this.speed = Math.random()*0.3+0.1; }
                update() { this.y += this.speed; if (this.y > starCanvas.height) this.y = 0; }
                draw() { sCtx.fillStyle = 'white'; sCtx.beginPath(); sCtx.arc(this.x, this.y, this.size, 0, Math.PI*2); sCtx.fill(); }
            }
            for (let i = 0; i < 150; i++) stars.push(new Star());
            function animateStars() { sCtx.clearRect(0,0,starCanvas.width,starCanvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animateStars); }
            animateStars();
        }
        window.addEventListener('resize', () => { location.reload(); });
    </script>
</body>
</html>
