<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        /* Nav Bar */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 30px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 18px 35px; border-radius: 15px; font-weight: 900; font-size: 28px; min-width: 120px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 18px 40px; border-radius: 60px; display: flex; gap: 30px; font-size: 28px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); }

        /* Search & Categories Area */
        .header-section { text-align: center; margin-bottom: 30px; padding: 0 20px; }
        #search-input { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 12px 30px; border-radius: 30px; width: 80%; max-width: 500px;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 25px;
        }

        /* Category Buttons from Screenshot 2026-02-04 200855.png */
        .category-container { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; 
            max-width: 1000px; margin: 0 auto;
        }
        .cat-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 25px; border-radius: 20px; font-weight: bold;
            cursor: pointer; transition: 0.3s; font-size: 14px;
        }
        .cat-btn:hover, .cat-btn.active { background: #5865f2; border-color: #c2f9bb; }

        /* Game Grid */
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; padding: 40px 50px; justify-items: center;
        }
        .game-card {
            width: 160px; height: 160px; background: #111; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .game-card:hover { transform: scale(1.05); border-color: #c2f9bb; }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-label { position: absolute; bottom: 0; background: rgba(0,0,0,0.8); width: 100%; text-align: center; padding: 5px 0; font-size: 12px; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" style="color: #c2f9bb;"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="header-section">
        <input type="text" id="search-input" placeholder="Search games..." onkeyup="filterGames()">
        
        <div class="category-container">
            <button class="cat-btn active">All</button>
            <button class="cat-btn">Adventure</button>
            <button class="cat-btn">Multiplayer</button>
            <button class="cat-btn">Idle</button>
            <button class="cat-btn">Horror</button>
            <button class="cat-btn">First Person Shooter</button>
            <button class="cat-btn">Driving</button>
            <button class="cat-btn">Puzzle</button>
            <button class="cat-btn">Shooting</button>
            <button class="cat-btn">Action</button>
            <button class="cat-btn">Platformer</button>
            <button class="cat-btn">Racing</button>
            <button class="cat-btn">RPG</button>
            <button class="cat-btn">Sports</button>
            <button class="cat-btn">Simulation</button>
            <button class="cat-btn">Strategy</button>
            <button class="cat-btn">Rhythm</button>
            <button class="cat-btn">Arcade</button>
        </div>
    </div>

    <div class="game-grid" id="game-container"></div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. 100 GAMES LIST
        const games = [
            {n: "Slope", i: "https://play-lh.googleusercontent.com/u7S8S6v14k-V1I6S"},
            {n: "1v1.lol", i: "https://play-lh.googleusercontent.com/66I9r6T8_h"},
            {n: "Tunnel Rush", i: "https://edumedia.site/img/tunnel-rush.png"},
            {n: "Retro Bowl", i: "https://play-lh.googleusercontent.com/mOvp_L_X"},
            {n: "Minecraft", i: "https://i.pinimg.com/originals/f3/f5/69/f3f5697b0"},
            {n: "Roblox", i: "https://th.bing.com/th/id/OIP.f8X"},
            {n: "Bitlife", i: "https://play-lh.googleusercontent.com/vHqV"},
            {n: "Among Us", i: "https://th.bing.com/th/id/OIP.u7"},
            {n: "Subway Surfers", i: "https://th.bing.com/th/id/OIP.zR"}
        ];

        // Fill up to 100
        for(let i=10; i<=105; i++) {
            games.push({n: "Game " + i, i: "https://via.placeholder.com/160/222/5865f2?text=G"+i});
        }

        const container = document.getElementById('game-container');
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => window.location.href = `go.html?gameurl=${g.n.toLowerCase().replace(/\s+/g, '-')}`;
            card.innerHTML = `<img src="${g.i}" onerror="this.src='https://via.placeholder.com/160'"><div class="game-label">${g.n}</div>`;
            container.appendChild(card);
        });

        // 3. SEARCH FILTER
        function filterGames() {
            const input = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                const title = card.innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            });
        }

        // 4. STARS
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Star {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function init() { for (let i = 0; i < 150; i++) stars.push(new Star()); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', resize); resize(); init(); animate();
    </script>
</body>
</html>
