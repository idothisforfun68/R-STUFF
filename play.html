<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        /* Nav Bar */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 30px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 18px 35px; border-radius: 15px; font-weight: 900; font-size: 28px; min-width: 120px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 18px 40px; border-radius: 60px; display: flex; gap: 30px; font-size: 28px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); }

        /* Search & Categories Area */
        .header-section { text-align: center; margin-bottom: 30px; padding: 0 20px; }
        #search-input { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 12px 30px; border-radius: 30px; width: 80%; max-width: 500px;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 25px;
        }

        .category-container { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; 
            max-width: 1000px; margin: 0 auto;
        }
        .cat-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 25px; border-radius: 20px; font-weight: bold;
            cursor: pointer; transition: 0.3s; font-size: 14px;
        }
        .cat-btn:hover, .cat-btn.active { background: #5865f2; border-color: #c2f9bb; color: white; }

        /* Game Grid */
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; padding: 40px 50px; justify-items: center;
        }
        .game-card {
            width: 160px; height: 160px; background: #111; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .game-card:hover { transform: scale(1.05); border-color: #c2f9bb; }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-label { position: absolute; bottom: 0; background: rgba(0,0,0,0.8); width: 100%; text-align: center; padding: 5px 0; font-size: 12px; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" style="color: #c2f9bb;"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="header-section">
        <input type="text" id="search-input" placeholder="Search games..." onkeyup="filterBySearch()">
        
        <div class="category-container" id="category-box">
            <button class="cat-btn active" onclick="filterByCategory('All', this)">All</button>
            <button class="cat-btn" onclick="filterByCategory('Action', this)">Action</button>
            <button class="cat-btn" onclick="filterByCategory('Adventure', this)">Adventure</button>
            <button class="cat-btn" onclick="filterByCategory('Driving', this)">Driving</button>
            <button class="cat-btn" onclick="filterByCategory('Shooting', this)">Shooting</button>
            <button class="cat-btn" onclick="filterByCategory('Idle', this)">Idle</button>
            <button class="cat-btn" onclick="filterByCategory('Horror', this)">Horror</button>
            <button class="cat-btn" onclick="filterByCategory('Puzzle', this)">Puzzle</button>
            <button class="cat-btn" onclick="filterByCategory('Multiplayer', this)">Multiplayer</button>
        </div>
    </div>

    <div class="game-grid" id="game-container"></div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. 100+ GAMES DATA
        const games = [
            {n: "Slope", c: "Action"}, {n: "Tunnel Rush", c: "Driving"}, {n: "1v1.lol", c: "Shooting"},
            {n: "Retro Bowl", c: "Action"}, {n: "Bitlife", c: "Idle"}, {n: "Minecraft", c: "Adventure"},
            {n: "Roblox", c: "Multiplayer"}, {n: "Among Us", c: "Multiplayer"}, {n: "Subway Surfers", c: "Action"},
            {n: "Cookie Clicker", c: "Idle"}, {n: "Geometry Dash", c: "Action"}, {n: "Happy Wheels", c: "Action"},
            {n: "Run 3", c: "Adventure"}, {n: "Duck Life 4", c: "Adventure"}, {n: "Tetris", c: "Puzzle"},
            {n: "2048", c: "Puzzle"}, {n: "Friday Night Funkin'", c: "Action"}, {n: "Elastic Man", c: "Idle"},
            {n: "Paper.io 2", c: "Multiplayer"}, {n: "Agar.io", c: "Multiplayer"}, {n: "Slither.io", c: "Multiplayer"},
            {n: "Hole.io", c: "Multiplayer"}, {n: "Shell Shockers", c: "Shooting"}, {n: "Krunker.io", c: "Shooting"},
            {n: "Zombs Royale", c: "Shooting"}, {n: "Snowball.io", c: "Multiplayer"}, {n: "EvoWorld.io", c: "Multiplayer"},
            {n: "Gats.io", c: "Shooting"}, {n: "Little Big Snake", c: "Multiplayer"}, {n: "Wings.io", c: "Shooting"},
            {n: "Drift Hunters", c: "Driving"}, {n: "Madalin Stunt Cars 2", c: "Driving"}, {n: "Moto X3M", c: "Driving"},
            {n: "Hill Climb Racing", c: "Driving"}, {n: "Crossy Road", c: "Action"}, {n: "Temple Run", c: "Action"},
            {n: "Jetpack Joyride", c: "Action"}, {n: "Cut the Rope", c: "Puzzle"}, {n: "Fruit Ninja", c: "Action"},
            {n: "Flappy Bird", c: "Action"}, {n: "Plants vs Zombies", c: "Puzzle"}, {n: "Five Nights at Freddy's", c: "Horror"},
            {n: "Baldi's Basics", c: "Horror"}, {n: "Granny", c: "Horror"}, {n: "The Backrooms", c: "Horror"},
            {n: "Evil Nun", c: "Horror"}, {n: "Slendrina", c: "Horror"}, {n: "Pac-Man", c: "Puzzle"},
            {n: "Doodle Jump", c: "Action"}, {n: "Stickman Hook", c: "Action"}, {n: "Vex 7", c: "Action"},
            {n: "Bob the Robber", c: "Puzzle"}, {n: "Fireboy and Watergirl", c: "Puzzle"}, {n: "Papa's Pizzeria", c: "Idle"},
            {n: "Papa's Freezeria", c: "Idle"}, {n: "World's Hardest Game", c: "Puzzle"}, {n: "Google Snake", c: "Puzzle"},
            {n: "Dinosaur Game", c: "Action"}, {n: "Chess", c: "Puzzle"}, {n: "Solitaire", c: "Puzzle"},
            {n: "Minesweeper", c: "Puzzle"}, {n: "Candy Crush", c: "Puzzle"}, {n: "Angry Birds", c: "Puzzle"},
            {n: "Clash Royale", c: "Multiplayer"}, {n: "Brawl Stars", c: "Multiplayer"}, {n: "Deadshot.io", c: "Shooting"},
            {n: "Venge.io", c: "Shooting"}, {n: "Smash Karts", c: "Multiplayer"}, {n: "Bloxd.io", c: "Multiplayer"},
            {n: "Kirka.io", c: "Shooting"}, {n: "Ev.io", c: "Shooting"}, {n: "BuildNow GG", c: "Shooting"},
            {n: "Narrow.one", c: "Shooting"}, {n: "Basket Bros", c: "Action"}, {n: "Soccer Random", c: "Action"},
            {n: "Boxing Random", c: "Action"}, {n: "Volley Random", c: "Action"}, {n: "Getaway Shootout", c: "Action"},
            {n: "Rooftop Snipers", c: "Shooting"}, {n: "Tunnel Rush 2", c: "Driving"}, {n: "Slow Roads", c: "Driving"},
            {n: "Tanuki Sunset", c: "Driving"}, {n: "Vector", c: "Action"}, {n: "Shadow Fight 2", c: "Action"},
            {n: "Tomb Runner", c: "Action"}, {n: "Color Tunnel", c: "Driving"}, {n: "Slope 2", c: "Action"},
            {n: "Super Mario 64", c: "Adventure"}, {n: "Sonic Reborn", c: "Adventure"}, {n: "Pokémon Emerald", c: "Adventure"},
            {n: "Terraria", c: "Adventure"}, {n: "Stardew Valley", c: "Adventure"}, {n: "Clicker Heroes", c: "Idle"},
            {n: "Adventure Capitalist", c: "Idle"}, {n: "Dogeminer 2", c: "Idle"}, {n: "Capybara Clicker", c: "Idle"},
            {n: "Idle Breakout", c: "Idle"}, {n: "Grindcraft", c: "Idle"}, {n: "Learn to Fly 3", c: "Adventure"},
            {n: "Burrito Bison", c: "Action"}, {n: "Toss the Turtle", c: "Action"}, {n: "Bloons TD 6", c: "Puzzle"}
        ];

        const container = document.getElementById('game-container');
        function loadGames() {
            games.forEach(g => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-category', g.c);
                // Using a stylized placeholder that shows the name
                const imageUrl = `https://via.placeholder.com/160/222/5865f2?text=${encodeURIComponent(g.n)}`;
                card.innerHTML = `<img src="${imageUrl}"><div class="game-label">${g.n}</div>`;
                card.onclick = () => window.location.href = `go.html?gameurl=${g.n.toLowerCase().replace(/\s+/g, '-')}`;
                container.appendChild(card);
            });
        }
        loadGames();

        // 3. FILTER LOGIC
        function filterByCategory(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                card.style.display = (category === 'All' || cardCat === category) ? "flex" : "none";
            });
        }

        function filterBySearch() {
            const input = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                const title = card.innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            });
        }

        // 4. STARS
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Star {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function init() { for (let i = 0; i < 150; i++) stars.push(new Star()); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', resize); resize(); init(); animate();
    </script>
</body>
</html>
