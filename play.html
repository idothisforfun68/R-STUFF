<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: black; color: white; margin: 0; 
            font-family: 'Segoe UI', sans-serif; overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding-top: 140px;
        }
        
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        #fps-counter { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 20; }

        /* Enlarged UI */
        .top-nav-container { position: fixed; top: 30px; display: flex; align-items: center; gap: 25px; z-index: 100; }
        .clock-box { 
            background: rgba(255,255,255,0.15); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 24px; backdrop-filter: blur(10px);
        }
        .nav-dock { 
            background: rgba(255,255,255,0.15); padding: 15px 45px; border-radius: 60px; 
            display: flex; gap: 35px; font-size: 32px; backdrop-filter: blur(10px);
        }
        .nav-dock a { color: white; text-decoration: none; transition: 0.3s; }
        .nav-dock a:hover { transform: scale(1.25); color: #c2f9bb; }
        .active-nav { color: #88ff88 !important; }

        /* Search Section */
        .search-container { width: 100%; max-width: 600px; text-align: center; margin-bottom: 20px; }
        #gameSearch { 
            width: 100%; padding: 15px 25px; border-radius: 30px; border: none; 
            background: rgba(255,255,255,0.1); color: white; font-size: 18px; outline: none;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
        }
        .search-btns { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .s-btn { 
            background: rgba(255,255,255,0.1); border: none; color: white; 
            padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .s-btn:hover { background: #88ff88; color: black; }

        /* Game Grid */
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; width: 90%; max-width: 1300px; padding: 20px 0 100px 0; 
        }
        .game-card { 
            position: relative; border-radius: 15px; overflow: hidden; 
            aspect-ratio: 1/1; cursor: pointer; transition: 0.3s;
            border: 2px solid rgba(255,255,255,0.1); background: #111;
        }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-card:hover { transform: translateY(-10px); border-color: #88ff88; }
        .game-info {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8);
            color: white; padding: 10px; text-align: center; font-size: 14px; opacity: 0; transition: 0.3s;
        }
        .game-card:hover .game-info { opacity: 1; }

        /* Game Overlay */
        #game-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; display: none;
        }
        #game-frame { width: 100%; height: calc(100% - 60px); border: none; }
        .overlay-bar {
            height: 60px; background: #222; display: flex; 
            align-items: center; padding: 0 20px; gap: 20px;
        }
        .ov-btn { 
            background: #444; color: white; border: none; padding: 10px; 
            border-radius: 5px; cursor: pointer; font-size: 20px; 
        }
        .close-btn { margin-left: auto; background: #ff4444; }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-nav-container">
        <div class="clock-box" id="clock">00:00 PM</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" class="active-nav"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="gameSearch" placeholder="Search for games..." onkeyup="filterGames()">
        <div class="search-btns">
            <button class="s-btn" onclick="filterCat('all')">All</button>
            <button class="s-btn" onclick="filterCat('action')">Action</button>
            <button class="s-btn" onclick="filterCat('casual')">Casual</button>
            <button class="s-btn" onclick="filterCat('multiplayer')">Multiplayer</button>
        </div>
    </div>

    <div class="game-grid" id="gameGrid">
        </div>

    <div id="game-overlay">
        <div class="overlay-bar">
            <button class="ov-btn" onclick="toggleFull()"><i class="fa-solid fa-expand"></i></button>
            <button class="ov-btn" onclick="reloadGame()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="ov-btn close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Game Database (Simulating 100 slots)
        const games = [
            { name: "Minecraft Classic", url: "https://classic.minecraft.net", img: "https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.png", cat: "casual" },
            { name: "1v1.LOL", url: "https://1v1.lol", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9S9hC6g", cat: "multiplayer" },
            { name: "BitLife", url: "https://bitlifeonline.io", img: "https://play-lh.googleusercontent.com/6990", cat: "casual" },
            { name: "Slope", url: "https://slopegame.online", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_xN", cat: "action" },
            // Add more game objects here to reach 100...
        ];

        // Fill grid
        function loadGrid(list) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(game.url);
                card.innerHTML = `<img src="${game.img}" onerror="this.src='https://via.placeholder.com/200?text=Game'"><div class="game-info">${game.name}</div>`;
                grid.appendChild(card);
            });
        }
        loadGrid(games);

        function filterGames() {
            const term = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = games.filter(g => g.name.toLowerCase().includes(term));
            loadGrid(filtered);
        }

        // Overlay Logic
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
        function reloadGame() { document.getElementById('game-frame').contentWindow.location.reload(); }
        function toggleFull() { document.getElementById('game-frame').requestFullscreen(); }

        // Clock & FPS
        function updateClock() {
            const now = new Date();
            let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        let times = [];
        function calculateFPS() {
            window.requestAnimationFrame(() => {
                const now = performance.now();
                while (times.length > 0 && times[0] <= now - 1000) times.shift();
                times.push(now);
                document.getElementById('fps-counter').innerText = `FPS: ${times.length}`;
                calculateFPS();
            });
        }
        calculateFPS();

        // Rain/Stars
        if (localStorage.getItem('rain') === 'enabled') {
            const rCtx = document.getElementById('rain').getContext('2d');
            let drops = [];
            const rc = document.getElementById('rain');
            rc.width = window.innerWidth; rc.height = window.innerHeight;
            class Drop {
                constructor() { this.init(); }
                init() { this.x = Math.random()*rc.width; this.y = Math.random()*-rc.height; this.speed = 15; this.len = 20; }
                update() { this.y += this.speed; if (this.y > rc.height) this.init(); }
                draw() { rCtx.strokeStyle = 'rgba(255,255,255,0.2)'; rCtx.strokeRect(this.x, this.y, 1, this.len); }
            }
            for(let i=0; i<100; i++) drops.push(new Drop());
            function animRain() { rCtx.clearRect(0,0,rc.width,rc.height); drops.forEach(d=>{d.update(); d.draw();}); requestAnimationFrame(animRain); }
            animRain();
        }
    </script>
</body>
</html>
