<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        /* Navigation */
        .top-bar { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; padding: 20px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 12px; font-weight: 900; font-size: 24px; min-width: 100px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 15px 35px; border-radius: 60px; display: flex; gap: 25px; font-size: 24px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); color: #c2f9bb; }

        /* Search & Categories */
        .header-section { position: relative; z-index: 10; text-align: center; margin-bottom: 20px; }
        #search-input { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; padding: 10px 25px; border-radius: 30px; width: 60%; max-width: 400px;
            font-size: 16px; text-align: center; outline: none; margin-bottom: 15px;
        }
        .category-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 900px; margin: 0 auto; }
        .cat-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 12px;
        }
        .cat-btn.active, .cat-btn:hover { background: #5865f2; border-color: #c2f9bb; }

        /* Game Grid */
        .game-grid { 
            position: relative; z-index: 10;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; padding: 20px 50px; height: 65vh; overflow-y: auto; justify-items: center;
        }
        .game-card {
            width: 150px; height: 150px; background: rgba(26, 26, 26, 0.8); border-radius: 20px;
            cursor: pointer; transition: 0.3s; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1); position: relative;
        }
        .game-card:hover { transform: translateY(-5px); border-color: #c2f9bb; box-shadow: 0 0 15px rgba(194, 249, 187, 0.2); }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-label { 
            position: absolute; bottom: 0; background: rgba(0,0,0,0.85); width: 100%; 
            text-align: center; padding: 8px 0; font-size: 12px; opacity: 0; transition: 0.3s;
        }
        .game-card:hover .game-label { opacity: 1; }

        /* --- BLACK OVERLAY WITH PARTICLES --- */
        #game-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 1000; display: none;
        }
        #game-frame { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 80%; border: 2px solid rgba(255,255,255,0.1); 
            border-radius: 10px; background: #000; z-index: 1002; 
        }

        .close-btn {
            position: absolute; top: 20px; right: 25px; font-size: 35px;
            color: white; cursor: pointer; z-index: 1003; transition: 0.3s;
        }
        .close-btn:hover { color: #ff5f57; }

        /* Bottom Bar Controls */
        .game-controls-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: rgba(255,255,255,0.05); display: flex; align-items: center;
            padding: 0 25px; gap: 10px; z-index: 1003; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .control-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 45px; height: 45px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: 0.2s;
        }
        .control-btn:hover { background: rgba(255,255,255,0.2); }

        /* URL Text Display */
        #url-display {
            color: #ccc; font-family: monospace; font-size: 13px;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
            max-width: 600px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            display: none; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div id="main-ui">
        <div class="top-bar">
            <div id="clock">--:-- --</div>
            <div class="nav-dock">
                <a href="index.html"><i class="fa-solid fa-house"></i></a>
                <a href="play.html" style="color: #c2f9bb;"><i class="fa-solid fa-gamepad"></i></a>
                <a href="#"><i class="fa-solid fa-border-all"></i></a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
                <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
            </div>
        </div>

        <div class="header-section">
            <input type="text" id="search-input" placeholder="Search games..." onkeyup="filterBySearch()">
            <div class="category-container">
                <button class="cat-btn active" onclick="filterByCategory('All', this)">All</button>
                <button class="cat-btn" onclick="filterByCategory('Action', this)">Action</button>
                <button class="cat-btn" onclick="filterByCategory('Adventure', this)">Adventure</button>
                <button class="cat-btn" onclick="filterByCategory('Horror', this)">Horror</button>
                <button class="cat-btn" onclick="filterByCategory('Multiplayer', this)">Multiplayer</button>
                <button class="cat-btn" onclick="filterByCategory('Driving', this)">Driving</button>
                <button class="cat-btn" onclick="filterByCategory('Shooting', this)">Shooting</button>
                <button class="cat-btn" onclick="filterByCategory('Idle', this)">Idle</button>
            </div>
        </div>

        <div class="game-grid" id="game-container"></div>
    </div>

    <div id="game-overlay">
        <i class="fa-solid fa-xmark close-btn" onclick="closeGame()"></i>
        
        <iframe id="game-frame" src=""></iframe>

        <div class="game-controls-bar">
            <button class="control-btn" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i></button>
            <button class="control-btn" onclick="refreshGame()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="control-btn" onclick="toggleURL()"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
            <div id="url-display"></div>
        </div>
    </div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. GAMES DATA
        const games = [
            {n: "Slope", c: "Action", url: "https://kstuff.nekoweb.org/data/testing/data/cloud/astra-v2.html?img=https://astra.pxi-fusion.com/src/slope.png"},
            {n: "1v1.lol", c: "Shooting", url: "https://1v1.lol"},
            {n: "Tunnel Rush", c: "Driving", url: "https://kstuff.nekoweb.org/data/testing/data/cloud/astra-v2.html?img=https://astra.pxi-fusion.com/src/tunnel-rush.png"},
            {n: "Retro Bowl", c: "Action", url: "https://kstuff.nekoweb.org/data/testing/data/cloud/astra-v2.html?img=https://astra.pxi-fusion.com/src/retro-bowl.png"},
            {n: "Roblox", c: "Multiplayer", url: "https://warm-biscochitos-44c02e.netlify.app/data/proxies/static.html#combine=https://kstuff.nekoweb.org/data/testing/data/cloud/astra-v2.html?img=https://astra.pxi-fusion.com/src/roblox.png"}
        ];
        for(let i=6; i<=100; i++) { games.push({n: "Game "+i, c: "Action", url: "https://google.com"}); }

        const container = document.getElementById('game-container');
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.dataset.category = g.c;
            card.innerHTML = `<img src="https://placehold.co/150x150/222/5865f2?text=🎮"><div class="game-label">${g.n}</div>`;
            card.onclick = () => openGame(g.url);
            container.appendChild(card);
        });

        // 3. OVERLAY ACTIONS
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('url-display').textContent = url;
            document.getElementById('game-overlay').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.getElementById('url-display').style.display = 'none';
        }

        function toggleURL() {
            const disp = document.getElementById('url-display');
            disp.style.display = (disp.style.display === 'block') ? 'none' : 'block';
        }

        function refreshGame() {
            const frame = document.getElementById('game-frame');
            const tmp = frame.src; frame.src = ''; frame.src = tmp;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // 4. FILTERS
        function filterByCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = (cat === 'All' || card.dataset.category === cat) ? 'flex' : 'none';
            });
        }

        function filterBySearch() {
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
            });
        }

        // 5. STARS (Particle Background)
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Star {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function init() { stars = []; for (let i = 0; i < 150; i++) stars.push(new Star()); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', () => { resize(); init(); }); resize(); init(); animate();
    </script>
</body>
</html>
