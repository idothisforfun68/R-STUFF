<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
            background: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Settings Sidebar/Panel Container */
        .settings-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h2 {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-left: 10px;
            color: #94d2bd;
            text-shadow: 0 0 10px rgba(148, 210, 189, 0.3);
        }

        /* Settings Buttons */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .settings-item i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Active/Default state (Matches the 'Information' button in your pic) */
        .settings-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Neon Hover Effect */
        .settings-item:hover {
            background: rgba(148, 210, 189, 0.2);
            color: white;
            transform: translateX(5px);
            box-shadow: inset 0 0 10px rgba(148, 210, 189, 0.2);
        }

        /* Home Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="settings-container">
        <h2>Settings</h2>
        <div class="settings-list">
            <a href="#" class="settings-item active">
                <i class="fa-solid fa-circle-info"></i> Information
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-sliders"></i> Defaults
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-ghost"></i> Cloaking
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-rectangle-ad"></i> Advertisements
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-palette"></i> Personalization
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-database"></i> Data
            </a>
            <a href="#" class="settings-item">
                <i class="fa-solid fa-heart"></i> Partners
            </a>
        </div>
    </div>

</body>
</html>
