<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* Nav Bar */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 20px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 12px; font-weight: 900; font-size: 24px; min-width: 100px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 15px 35px; border-radius: 60px; display: flex; gap: 25px; font-size: 24px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); color: #c2f9bb; }

        /* Settings Container */
        .settings-container {
            max-width: 600px; margin: 50px auto; padding: 40px;
            background: rgba(255, 255, 255, 0.05); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        }
        h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }

        .setting-item { margin-bottom: 30px; text-align: left; }
        label { display: block; margin-bottom: 10px; font-size: 14px; color: #aaa; text-transform: uppercase; }

        /* Proxy Dropdown Styling */
        .proxy-select {
            width: 100%; background: #333; color: white; border: 2px solid #444;
            padding: 12px; border-radius: 10px; font-size: 18px; outline: none;
            cursor: pointer; appearance: none; transition: 0.3s;
        }
        .proxy-select:focus { border-color: #5865f2; }

        .save-msg { color: #c2f9bb; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html" style="color: #c2f9bb;"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="settings-container">
        <h1>SETTINGS</h1>

        <div class="setting-item">
            <label>Proxy Mode</label>
            <select id="proxy-selector" class="proxy-select" onchange="saveProxy()">
                <option value="static">Static</option>
                <option value="extreme">ExtremeMath</option>
                <option value="scramjet">ScramJet</option>
            </select>
            <div id="status" class="save-msg">Settings Saved!</div>
        </div>
        
        <p style="color: #666; font-size: 12px;">Select a proxy to change how games are routed.</p>
    </div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. PROXY SAVING LOGIC
        function saveProxy() {
            const selection = document.getElementById('proxy-selector').value;
            localStorage.setItem('preferredProxy', selection);
            
            // Show "Saved" message
            const status = document.getElementById('status');
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 2000);
        }

        // Load saved setting on startup
        window.onload = () => {
            const saved = localStorage.getItem('preferredProxy');
            if (saved) {
                document.getElementById('proxy-selector').value = saved;
            }
        };

        // 3. STARS
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Star {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function init() { stars = []; for (let i = 0; i < 150; i++) stars.push(new Star()); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        window.addEventListener('resize', () => { resize(); init(); }); resize(); init(); animate();
    </script>
</body>
</html>
