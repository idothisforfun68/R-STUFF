<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; transition: background 0.3s; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* Navigation */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 20px 0; gap: 20px; }
        #clock { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 12px; font-weight: 900; font-size: 24px; min-width: 100px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 15px 35px; border-radius: 60px; display: flex; gap: 25px; font-size: 24px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); color: #c2f9bb; }

        /* Settings UI Components */
        .settings-content { display: flex; flex-direction: column; align-items: center; gap: 25px; margin-top: 40px; text-align: center; }
        
        .btn-main { background: #e0e0e0; color: black; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* Toggle Switch Styling */
        .toggle-row { display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 80px; height: 40px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2196F3; transition: .4s; border-radius: 40px; }
        .slider:before { position: absolute; content: ""; height: 32px; width: 32px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(40px); }

        /* Proxy Dropdown */
        .proxy-box { background: #333; color: white; border: 2px solid white; border-radius: 12px; padding: 10px 40px; font-size: 24px; appearance: none; cursor: pointer; width: 250px; text-align: center; }

        input[type="text"] { width: 350px; padding: 10px; border-radius: 5px; border: none; outline: none; margin-top: 10px; }
        .color-preview { width: 50px; height: 25px; border: 2px solid white; margin: 10px 0; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html" style="color: #c2f9bb;"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="settings-content">
        <select class="proxy-box" id="proxySelect" onchange="updateProxy()">
            <option value="static">Static</option>
            <option value="extreme">ExtremeMath</option>
            <option value="scramjet">ScramJet</option>
        </select>

        <button class="btn-main" onclick="toggleParticles()" id="particleBtn">Disable Particles</button>

        <div class="toggle-row">
            <span>Color</span>
            <label class="switch">
                <input type="checkbox" id="bgToggle" onchange="updateBGMode()">
                <span class="slider"></span>
            </label>
            <span>Image</span>
        </div>

        <div class="color-preview" id="colorPrev"></div>
        <input type="file" id="bgFile" style="display:none">
        <button class="btn-main" onclick="document.getElementById('bgFile').click()">Choose File</button>
        <input type="text" id="bgUrl" placeholder="Enter image URL">
        <button class="btn-main" onclick="applyBG()">Apply Image</button>

        <div class="toggle-row" style="font-size: 28px;">
            <span>Navbar Background</span>
            <label class="switch">
                <input type="checkbox" id="navToggle" onchange="updateNavMode()">
                <span class="slider"></span>
            </label>
            <span>Image</span>
        </div>

        <input type="text" id="navUrl" placeholder="Enter navbar image URL">
        <button class="btn-main" onclick="applyNavBG()">Apply Navbar Image</button>

        <div style="font-weight: bold; font-size: 20px; margin-top: 20px;">Rain</div>
    </div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. SETTINGS LOGIC
        function updateProxy() {
            localStorage.setItem('proxy', document.getElementById('proxySelect').value);
        }

        function toggleParticles() {
            let state = localStorage.getItem('particles') === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('particles', state);
            document.getElementById('particleBtn').innerText = state === 'disabled' ? "Enable Particles" : "Disable Particles";
            location.reload(); 
        }

        function applyBG() {
            const url = document.getElementById('bgUrl').value;
            if(url) {
                localStorage.setItem('bgImage', url);
                document.body.style.backgroundImage = `url(${url})`;
                document.body.style.backgroundSize = "cover";
            }
        }

        function applyNavBG() {
            const url = document.getElementById('navUrl').value;
            if(url) localStorage.setItem('navImage', url);
        }

        // Initialize state from LocalStorage
        window.onload = () => {
            if(localStorage.getItem('particles') === 'disabled') {
                document.getElementById('particleBtn').innerText = "Enable Particles";
            }
            if(localStorage.getItem('proxy')) {
                document.getElementById('proxySelect').value = localStorage.getItem('proxy');
            }
        };

        // 3. STAR PARTICLES (Canvas logic from previous version remains here)
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        if(localStorage.getItem('particles') !== 'disabled') {
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            class Star {
                constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
                update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
                draw() { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
            }
            function init() { stars = []; for (let i = 0; i < 150; i++) stars.push(new Star()); }
            function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
            window.addEventListener('resize', resize); resize(); init(); animate();
        }
    </script>
</body>
</html>
