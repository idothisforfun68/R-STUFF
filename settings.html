<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Background Layers */
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Navigation */
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 20px 0; gap: 20px; position: relative; z-index: 10; }
        #clock { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 12px; font-weight: 900; font-size: 24px; min-width: 100px; text-align: center; }
        .nav-dock { background: rgba(255,255,255,0.1); padding: 15px 35px; border-radius: 60px; display: flex; gap: 25px; font-size: 24px; }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); color: #c2f9bb; }

        /* Settings UI Components */
        .settings-content { display: flex; flex-direction: column; align-items: center; gap: 25px; margin-top: 40px; text-align: center; padding-bottom: 80px; position: relative; z-index: 10; }
        
        .btn-main { background: #e0e0e0; color: black; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-main:hover { background: #ffffff; transform: scale(1.05); }

        .toggle-row { display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 80px; height: 40px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2196F3; transition: .4s; border-radius: 40px; }
        .slider:before { position: absolute; content: ""; height: 32px; width: 32px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(40px); }

        /* Updated Proxy Dropdown */
        .proxy-box { background: #333; color: white; border: 2px solid white; border-radius: 12px; padding: 10px 40px; font-size: 24px; appearance: none; cursor: pointer; width: 300px; text-align: center; outline: none; }
        
        input[type="text"] { width: 350px; padding: 12px; border-radius: 5px; border: none; outline: none; margin-top: 10px; background: rgba(255,255,255,0.9); color: black; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html" style="color: #c2f9bb;"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="settings-content">
        <select class="proxy-box" id="proxySelect" onchange="updateProxy()">
            <option value="static">Static</option>
            <option value="extreme">ExtremeMath</option>
            <option value="scramjet">ScramJet</option>
            <option value="ultraviolet">Ultra Violet</option>
        </select>

        <button class="btn-main" onclick="toggleParticles()" id="particleBtn">Disable Particles</button>

        <div class="toggle-row">
            <span>Color</span>
            <label class="switch">
                <input type="checkbox" id="bgToggle">
                <span class="slider"></span>
            </label>
            <span>Image</span>
        </div>

        <button class="btn-main" onclick="applyBG()">Apply Image</button>
        <input type="text" id="bgUrl" placeholder="Enter image URL">

        <div class="toggle-row" style="font-size: 28px;">
            <span>Navbar Background</span>
            <label class="switch">
                <input type="checkbox" id="navToggle">
                <span class="slider"></span>
            </label>
            <span>Image</span>
        </div>

        <button class="btn-main" onclick="applyNavBG()">Apply Navbar Image</button>

        <div style="font-weight: bold; font-size: 24px; margin-top: 10px;">Rain</div>
        <button class="btn-main" onclick="toggleRain()" id="rainBtn">Enable Rain</button>
    </div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. SETTINGS PERSISTENCE
        function updateProxy() { localStorage.setItem('proxy', document.getElementById('proxySelect').value); }
        
        function toggleParticles() {
            let state = localStorage.getItem('particles') === 'disabled' ? 'enabled' : 'disabled';
            localStorage.setItem('particles', state);
            location.reload(); 
        }

        function toggleRain() {
            let state = localStorage.getItem('rain') === 'enabled' ? 'disabled' : 'enabled';
            localStorage.setItem('rain', state);
            location.reload();
        }

        function applyBG() {
            const url = document.getElementById('bgUrl').value;
            if(url) localStorage.setItem('bgImage', url);
        }

        function applyNavBG() {
            const url = document.getElementById('navUrl').value;
            if(url) localStorage.setItem('navImage', url);
        }

        // 3. RAIN ENGINE
        const rainCanvas = document.getElementById('rain');
        const rCtx = rainCanvas.getContext('2d');
        let drops = [];

        if (localStorage.getItem('rain') === 'enabled') {
            document.getElementById('rainBtn').innerText = "Disable Rain";
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;
            class Drop {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * rainCanvas.width;
                    this.y = Math.random() * -rainCanvas.height;
                    this.speed = Math.random() * 8 + 8;
                    this.len = Math.random() * 15 + 10;
                }
                update() {
                    this.y += this.speed;
                    if (this.y > rainCanvas.height) this.init();
                }
                draw() {
                    rCtx.strokeStyle = 'rgba(174, 194, 224, 0.4)';
                    rCtx.lineWidth = 1;
                    rCtx.beginPath();
                    rCtx.moveTo(this.x, this.y);
                    rCtx.lineTo(this.x, this.y + this.len);
                    rCtx.stroke();
                }
            }
            for (let i = 0; i < 120; i++) drops.push(new Drop());
            function animateRain() {
                rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
                drops.forEach(d => { d.update(); d.draw(); });
                requestAnimationFrame(animateRain);
            }
            animateRain();
        }

        // 4. STARS ENGINE
        const starCanvas = document.getElementById('stars');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];
        if (localStorage.getItem('particles') !== 'disabled') {
            starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight;
            class Star {
                constructor() { this.x = Math.random() * starCanvas.width; this.y = Math.random() * starCanvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.4 + 0.1; }
                update() { this.y += this.speed; if (this.y > starCanvas.height) this.y = 0; }
                draw() { sCtx.fillStyle = 'white'; sCtx.beginPath(); sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); sCtx.fill(); }
            }
            for (let i = 0; i < 100; i++) stars.push(new Star());
            function animateStars() {
                sCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
                stars.forEach(s => { s.update(); s.draw(); });
                requestAnimationFrame(animateStars);
            }
            animateStars();
        }

        window.onload = () => {
            if(localStorage.getItem('particles') === 'disabled') document.getElementById('particleBtn').innerText = "Enable Particles";
            if(localStorage.getItem('proxy')) document.getElementById('proxySelect').value = localStorage.getItem('proxy');
        };
    </script>
</body>
    <div id="browser-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; padding:20px; box-sizing:border-box;">
    <div style="width:100%; height:100%; background:#1a1b1e; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; border: 1px solid #333;">
        <div style="background:#25262b; padding:10px; display:flex; gap:10px; align-items:center;">
            <button onclick="document.getElementById('browser-overlay').style.display='none'" style="background:#ff5f56; border:none; width:15px; height:15px; border-radius:50%; cursor:pointer;"></button>
            <input type="text" id="browser-url" placeholder="Search or enter URL" style="flex-grow:1; background:#1a1b1e; border:1px solid #3d3e42; color:white; padding:8px 15px; border-radius:20px; outline:none;">
            <button onclick="navigateBrowser()" style="background:#4dabf7; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;">Go</button>
        </div>
        <iframe id="browser-frame" src="about:blank" style="flex-grow:1; border:none; background:white;"></iframe>
    </div>
</div>

<div onclick="toggleBrowser()" style="position:fixed; bottom:20px; right:20px; background:#4a4e57; color:white; padding:10px 20px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:10px; z-index:9999; font-weight:bold; font-family:sans-serif; border: 1px solid #666;">
    <i class="fa-solid fa-globe"></i> Browse
</div>

<script>
function toggleBrowser() {
    const overlay = document.getElementById('browser-overlay');
    overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
}

function navigateBrowser() {
    let url = document.getElementById('browser-url').value;
    if (!url.startsWith('http')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
    }
    document.getElementById('browser-frame').src = url;
}

// Handle "Enter" key in the URL bar
document.getElementById('browser-url').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        navigateBrowser();
    }
});
</script>
</html>
