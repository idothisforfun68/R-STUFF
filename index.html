<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: white;
            /* Aurora Borealis Animated Background */
            background: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Header: Time and Weather */
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Main Content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 5.5rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -3px;
            background: linear-gradient(to bottom, #ffffff, #94d2bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(148, 210, 189, 0.5));
        }

        .tagline {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-top: 5px;
            letter-spacing: 0.5px;
            font-weight: 400;
            color: #94d2bd;
            text-shadow: 0 0 8px rgba(148, 210, 189, 0.4);
        }

        /* Navigation Buttons with Neon Hover */
        .button-group {
            margin-top: 45px;
            display: flex;
            gap: 20px;
        }

        .app-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 35px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease-in-out;
            font-weight: 500;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }

        .app-btn:hover {
            background: rgba(148, 210, 189, 0.15);
            border-color: #94d2bd;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(148, 210, 189, 0.6), inset 0 0 5px rgba(148, 210, 189, 0.4);
            color: #ffffff;
        }

        /* Discord Button Bottom Left */
        .discord-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: #5865F2;
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .discord-btn:hover {
            transform: scale(1.1);
            background: #4752c4;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="clock">00:00:00 AM</span>
        <span>|</span>
        <span id="weather">50°F</span>
    </div>

    <div class="container">
        <h1>ProjectNEON</h1>
        <p class="tagline">Oscar REALLY made this site so hop off</p>

        <div class="button-group">
            <a href="play.html" class="app-btn">Games</a>
            <a href="apps.html" class="app-btn">Apps</a>
            <a href="settings.html" class="app-btn">Settings</a>
        </div>
    </div>

    <a href="https://discord.gg/7sJNnumT" class="discord-btn" target="_blank">
        <i class="fa-brands fa-discord"></i>
    </a>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerHTML = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
