<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* The background stars board */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Navigation Bar Styling */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            gap: 20px;
        }

        #clock {
            background: rgba(255, 255, 255, 0.1);
            padding: 18px 35px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 28px;
            min-width: 120px;
            text-align: center;
        }

        .nav-dock {
            background: rgba(255, 255, 255, 0.1);
            padding: 18px 40px;
            border-radius: 60px;
            display: flex;
            gap: 30px;
            font-size: 28px;
        }

        .nav-dock a {
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .nav-dock a:hover {
            transform: scale(1.2);
        }

        /* Main Content */
        .main-container {
            text-align: center;
            margin-top: 100px;
            position: relative;
