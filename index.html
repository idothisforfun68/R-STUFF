</head>
<body style="background-color: black; color: white; margin: 0; font-family: sans-serif;">

    <div class="top-bar" style="display: flex; justify-content: center; align-items: center; width: 100%; padding: 20px 0; gap: 15px;">
    <div id="clock" style="background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 15px; font-weight: bold; font-size: 24px; min-width: 100px; text-align: center;">
    --:-- --
</div>

    <div class="nav-dock" style="background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 50px; display: flex; gap: 25px; font-size: 24px;">
    <a href="index.html" style="color: white;"><i class="fa-solid fa-house"></i></a>
    <a href="play.html" style="color: white;"><i class="fa-solid fa-gamepad"></i></a>
    <i class="fa-solid fa-border-all"></i>
    <i class="fa-solid fa-gear"></i>
    <a href="credits.html" style="color: white; text-decoration: none;">
    <i class="fa-solid fa-credit-card"></i>
</a>
</div>
</div>
        </div>
    </div>

    <div class="center" style="text-align: center; width: 100%; margin-top: 100px; display: flex; flex-direction: column; align-items: center;">
        <h1 id="title" style="font-size: 110px; color: #c2f9bb; font-family: 'Arial Black', sans-serif; letter-spacing: -5px; margin: 0;">R-STUFF</h1>
        <p id="subtitle" style="color: #888; font-size: 20px; margin-top: -10px;">Oscar Loves Taco's 🌮</p>
        
        <a href="play.html" style="text-decoration: none; margin-top: 30px;">
            <button style="padding: 15px 40px; background-color: #5865f2; color: white; border-radius: 8px; font-weight: bold; font-size: 20px; border: none; cursor: pointer;">
                Click to Play Games
            </button>
            <script>
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        // Convert to 12-hour format
        hours = hours % 12 || 12; 
        
        const timeString = hours + ':' + minutes + ' ' + ampm;
        document.getElementById('clock').textContent = timeString;
    }

    // Update the clock every second
    setInterval(updateClock, 1000);

    // Run once immediately so it doesn't show --:-- on load
    updateClock();
</script>
        </a>
    </div>

</body>
