<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Background Layers */
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Navigation Dock */
        .nav-dock { 
            position: absolute; top: 20px; background: rgba(255,255,255,0.1); 
            padding: 15px 35px; border-radius: 60px; display: flex; gap: 25px; font-size: 24px; 
        }
        .nav-dock a { color: white; text-decoration: none; transition: 0.2s; }
        .nav-dock a:hover { transform: scale(1.2); color: #c2f9bb; }

        /* Main Welcome Text */
        .welcome-container { text-align: center; z-index: 10; }
        h1 { font-size: 80px; margin: 0; letter-spacing: 10px; font-weight: 300; }
        p { font-size: 18px; color: #aaa; margin-top: 10px; }

        /* Discord Button Styling */
        .discord-btn {
            margin-top: 30px; background: #5865F2; color: white; border: none;
            padding: 15px 30px; border-radius: 12px; font-size: 18px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: 0.3s; text-decoration: none; width: fit-content; margin-left: auto; margin-right: auto;
        }
        .discord-btn:hover { background: #4752c4; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(88, 101, 242, 0.3); }

        /* Clock Overlay */
        #clock { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 12px; font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div id="clock">--:-- --</div>

    <div class="nav-dock">
        <a href="index.html" style="color: #c2f9bb;"><i class="fa-solid fa-house"></i></a>
        <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
        <a href="#"><i class="fa-solid fa-border-all"></i></a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
        <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
    </div>

    <div class="welcome-container">
        <h1>R-STUFF</h1>
        <p>Your ultimate hub for games and tools.</p>
        
        <a href="https://discord.gg/7sJNnumT" target="_blank" class="discord-btn">
            <i class="fa-brands fa-discord"></i> Join the Discord
        </a>
    </div>

    <script>
        // 1. CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. RAIN ENGINE (Global Toggle)
        const rainCanvas = document.getElementById('rain');
        if (localStorage.getItem('rain') === 'enabled') {
            const rCtx = rainCanvas.getContext('2d');
            let drops = [];
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;

            class Drop {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * rainCanvas.width;
                    this.y = Math.random() * -rainCanvas.height;
                    this.speed = Math.random() * 8 + 8;
                    this.len = Math.random() * 15 + 10;
                }
                update() { this.y += this.speed; if (this.y > rainCanvas.height) this.init(); }
                draw() {
                    rCtx.strokeStyle = 'rgba(174, 194, 224, 0.4)';
                    rCtx.lineWidth = 1;
                    rCtx.beginPath();
                    rCtx.moveTo(this.x, this.y);
                    rCtx.lineTo(this.x, this.y + this.len);
                    rCtx.stroke();
                }
            }
            for (let i = 0; i < 120; i++) drops.push(new Drop());
            function animateRain() {
                rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
                drops.forEach(d => { d.update(); d.draw(); });
                requestAnimationFrame(animateRain);
            }
            animateRain();
        }

        // 3. STARS ENGINE
        const starCanvas = document.getElementById('stars');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];
        if (localStorage.getItem('particles') !== 'disabled') {
            starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight;
            class Star {
                constructor() { this.x = Math.random() * starCanvas.width; this.y = Math.random() * starCanvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.4 + 0.1; }
                update() { this.y += this.speed; if (this.y > starCanvas.height) this.y = 0; }
                draw() { sCtx.fillStyle = 'white'; sCtx.beginPath(); sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); sCtx.fill(); }
            }
            for (let i = 0; i < 100; i++) stars.push(new Star());
            function animateStars() {
                sCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
                stars.forEach(s => { s.update(); s.draw(); });
                requestAnimationFrame(animateStars);
            }
            animateStars();
        }
        
        window.addEventListener('resize', () => {
            location.reload(); // Quickest way to fix canvas scaling on resize
        });
    </script>
</body>
</html>
