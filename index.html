<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* The background stars board */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Navigation Bar Styling */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            gap: 20px;
        }

        #clock {
            background: rgba(255, 255, 255, 0.1);
            padding: 18px 35px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 28px;
            min-width: 120px;
            text-align: center;
        }

        .nav-dock {
            background: rgba(255, 255, 255, 0.1);
            padding: 18px 40px;
            border-radius: 60px;
            display: flex;
            gap: 30px;
            font-size: 28px;
        }

        .nav-dock a {
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .nav-dock a:hover {
            transform: scale(1.2);
        }

        /* Main Content */
        .main-container {
            text-align: center;
            margin-top: 100px;
            position: relative;
        }

        h1 {
            font-size: 110px;
            color: #c2f9bb;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -5px;
            margin: 0;
        }

        .subtitle {
            color: #888;
            font-size: 20px;
            margin-top: -10px;
        }

        #toggle-stars {
            margin-top: 40px;
            padding: 15px 40px;
            background-color: #5865f2;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        #toggle-stars:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="top-bar">
        <div id="clock">--:-- --</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="main-container">
        <h1>R-STUFF</h1>
        <p class="subtitle">Oscar Loves Taco's 🌮</p>
        
        <button id="toggle-stars">Disable Particles</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            const clockElement = document.getElementById('clock');
            if (clockElement) {
                clockElement.textContent = hours + ':' + minutes + ' ' + ampm;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let particlesEnabled = true;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particlesEnabled) {
                stars.forEach(star => {
                    star.update();
                    star.draw();
                });
            }
            requestAnimationFrame(animate);
        }

        // Particle Toggle Logic
        const disableBtn = document.getElementById('toggle-stars');
        if (disableBtn) {
            disableBtn.onclick = function() {
                particlesEnabled = !particlesEnabled;
                this.textContent = particlesEnabled ? "Disable Particles" : "Enable Particles";
            };
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        animate();
    </script>

</body>
    <canvas id="rain" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></canvas>

<script>
    const rainCanvas = document.getElementById('rain');
    if (localStorage.getItem('rain') === 'enabled' && rainCanvas) {
        const rCtx = rainCanvas.getContext('2d');
        let drops = [];
        rainCanvas.width = window.innerWidth; 
        rainCanvas.height = window.innerHeight;

        class Drop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * rainCanvas.width;
                this.y = Math.random() * -rainCanvas.height;
                this.speed = Math.random() * 8 + 8;
                this.len = Math.random() * 15 + 10;
            }
            update() {
                this.y += this.speed;
                if (this.y > rainCanvas.height) this.init();
            }
            draw() {
                rCtx.strokeStyle = 'rgba(174, 194, 224, 0.4)';
                rCtx.lineWidth = 1;
                rCtx.beginPath();
                rCtx.moveTo(this.x, this.y);
                rCtx.lineTo(this.x, this.y + this.len);
                rCtx.stroke();
            }
        }

        for (let i = 0; i < 120; i++) drops.push(new Drop());
        function animateRain() {
            rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
            drops.forEach(d => { d.update(); d.draw(); });
            requestAnimationFrame(animateRain);
        }
        animateRain();
        window.addEventListener('resize', () => {
            rainCanvas.width = window.innerWidth;
            rainCanvas.height = window.innerHeight;
        });
    }
</script>
</html>
