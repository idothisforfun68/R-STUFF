<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: black; color: white; margin: 0; 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; 
        }
        
        /* Layered Background Effects */
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* FPS Counter - Live */
        #fps-counter {
            position: absolute; top: 20px; left: 20px;
            font-family: 'Segoe UI', sans-serif; font-size: 24px; font-weight: bold;
            color: white; z-index: 20;
        }

        /* ENLARGED Nav Dock with Integrated Clock */
        .top-nav-container {
            position: absolute; top: 30px; display: flex; align-items: center; gap: 25px;
        }
        .clock-box {
            background: rgba(255,255,255,0.15); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 24px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-dock { 
            background: rgba(255,255,255,0.15); padding: 15px 45px; border-radius: 60px; 
            display: flex; gap: 35px; font-size: 32px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-dock a { color: #88ff88; text-decoration: none; transition: 0.3s; }
        .nav-dock a.inactive { color: white; }
        .nav-dock a:hover { transform: scale(1.25); color: #c2f9bb; }

        /* Original Bold Title Style */
        .welcome-container { text-align: center; z-index: 10; }
        .main-title { 
            font-size: 130px; font-weight: 900; margin: 0; letter-spacing: -2px; 
            text-transform: uppercase; color: white;
            text-shadow: 0 0 30px rgba(255,255,255,0.4);
        }
        .sub-text { font-size: 18px; color: #aaa; margin-top: -10px; letter-spacing: 5px; text-transform: uppercase; }

        /* Discord Button */
        .discord-btn {
            margin-top: 30px; background: #5865F2; color: white; border: none;
            padding: 15px 30px; border-radius: 12px; font-size: 20px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: 0.3s; text-decoration: none; width: fit-content; margin: 30px auto 0;
        }
        .discord-btn:hover { background: #4752c4; transform: scale(1.05); box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-nav-container">
        <div class="clock-box" id="clock">00:00 PM</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" class="inactive"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#" class="inactive"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html" class="inactive"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html" class="inactive"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="welcome-container">
        <h1 class="main-title">R-STUFF</h1>
        <div class="sub-text">GAMES • TOOLS • PROXIES</div>
        <a href="https://discord.gg/7sJNnumT" target="_blank" class="discord-btn">
            <i class="fa-brands fa-discord"></i> Join Discord
        </a>
    </div>

    <script>
        // 1. LIVE FPS COUNTER
        const fpsDisplay = document.getElementById('fps-counter');
        let times = [];
        function calculateFPS() {
            window.requestAnimationFrame(() => {
                const now = performance.now();
                while (times.length > 0 && times[0] <= now - 1000) {
                    times.shift();
                }
                times.push(now);
                fpsDisplay.innerText = `FPS: ${times.length}`;
                calculateFPS();
            });
        }
        calculateFPS();

        // 2. EXACT CLOCK
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // 3. RAIN ENGINE
        const rainCanvas = document.getElementById('rain');
        if (localStorage.getItem('rain') === 'enabled') {
            const rCtx = rainCanvas.getContext('2d');
            let drops = [];
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;
            class Drop {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * rainCanvas.width;
                    this.y = Math.random() * -rainCanvas.height;
                    this.speed = Math.random() * 10 + 10;
                    this.len = Math.random() * 20 + 10;
                }
                update() { this.y += this.speed; if (this.y > rainCanvas.height) this.init(); }
                draw() {
                    rCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    rCtx.lineWidth = 1; rCtx.beginPath();
                    rCtx.moveTo(this.x, this.y); rCtx.lineTo(this.x, this.y + this.len);
                    rCtx.stroke();
                }
            }
            for (let i = 0; i < 100; i++) drops.push(new Drop());
            function animateRain() {
                rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
                drops.forEach(d => { d.update(); d.draw(); });
                requestAnimationFrame(animateRain);
            }
            animateRain();
        }

        // 4. STAR PARTICLES ENGINE
        const starCanvas = document.getElementById('stars');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];
        if (localStorage.getItem('particles') !== 'disabled') {
            starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight;
            class Star {
                constructor() { this.x = Math.random() * starCanvas.width; this.y = Math.random() * starCanvas.height; this.size = Math.random() * 1.5; this.speed = Math.random() * 0.3 + 0.1; }
                update() { this.y += this.speed; if (this.y > starCanvas.height) this.y = 0; }
                draw() { sCtx.fillStyle = 'white'; sCtx.beginPath(); sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); sCtx.fill(); }
            }
            for (let i = 0; i < 150; i++) stars.push(new Star());
            function animateStars() {
                sCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
                stars.forEach(s => { s.update(); s.draw(); });
                requestAnimationFrame(animateStars);
            }
            animateStars();
        }
        window.addEventListener('resize', () => { location.reload(); });
    </script>
</body>
</html>
