<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Effect Layers */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .aurora-active { animation: aurora 15s ease infinite; }
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: #94d2bd; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-weight: 500; cursor: pointer; }
        .nav-links a:hover { color: white; }

        /* Home View Dashboard */
        #home-view {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: calc(100vh - 80px); text-align: center;
        }
        .time-weather { font-size: 1.2rem; margin-bottom: 20px; font-weight: 300; opacity: 0.9; }
        .main-title { font-size: 5rem; font-weight: 800; margin: 0; letter-spacing: -2px; }
        .main-subtitle { font-size: 1.2rem; opacity: 0.6; margin-top: 10px; }

        /* Games View */
        #games-view { display: none; padding: 40px 20px; height: calc(100vh - 80px); overflow-y: auto; }
        .search-container { max-width: 600px; margin: 0 auto 50px auto; position: relative; }
        .search-container input {
            width: 100%; padding: 15px 50px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: white; outline: none;
        }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { 
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; text-decoration: none; color: white;
        }
        .game-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }

        /* Discord Button */
        .discord-btn {
            position: fixed; bottom: 30px; left: 30px;
            background: #5865F2; color: white; padding: 15px 25px;
            border-radius: 15px; text-decoration: none; font-weight: 600;
            display: flex; align-items: center; gap: 10px; font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .discord-btn:hover { transform: scale(1.05); background: #4752c4; }

        /* Effects Panel */
        .effects-panel {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; gap: 10px;
        }
        .effect-toggle {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
        }
        .effect-toggle.active { background: #94d2bd; color: #001219; border-color: #94d2bd; }
    </style>
</head>
<body class="aurora-active">

    <canvas id="canvas-container"></canvas>

    <nav>
        <a onclick="showView('home')" class="logo">ProjectNEON</a>
        <div class="nav-links">
            <a onclick="showView('home')"><i class="fa-solid fa-house"></i> Home</a>
            <a onclick="showView('games')">Games</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </nav>

    <div id="home-view">
        <div class="time-weather" id="display-info">00:00 AM | Loading Weather...</div>
        <h1 class="main-title">ProjectNEON <span style="font-weight: 300; opacity: 0.8;">v4</span></h1>
        <p class="main-subtitle">Oscar REALLY made this site so hop off Brantley</p>
    </div>

    <div id="games-view">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:20px; top:18px; opacity:0.5;"></i>
            <input type="text" placeholder="Search games..." onkeyup="filterGames(this.value)">
        </div>
        <div class="game-grid" id="gameGrid">
            <a href="#" class="game-card"><span>Example Game 1</span></a>
            <a href="#" class="game-card"><span>Example Game 2</span></a>
        </div>
    </div>

    <a href="https://discord.gg/6A9Z2KJM" target="_blank" class="discord-btn">
        <i class="fa-brands fa-discord"></i> Discord
    </a>

    <div class="effects-panel">
        <button class="effect-toggle active" onclick="toggleEffect('aurora', this)">Aurora</button>
        <button class="effect-toggle" onclick="toggleEffect('rain', this)">Rain</button>
        <button class="effect-toggle" onclick="toggleEffect('particles', this)">Particles</button>
    </div>

    <script>
        function showView(view) {
            document.getElementById('home-view').style.display = view === 'home' ? 'flex' : 'none';
            document.getElementById('games-view').style.display = view === 'games' ? 'block' : 'none';
        }

        // Exact Time and Weather
        function updateStatus() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            // Static weather for demo, typically requires an API key for live location
            const weatherStr = "46°F"; 
            document.getElementById('display-info').innerText = `${timeStr} | ${weatherStr}`;
        }
        setInterval(updateStatus, 1000);
        updateStatus();

        // Effect Logic
        function toggleEffect(type, btn) {
            btn.classList.toggle('active');
            if(type === 'aurora') {
                document.body.classList.toggle('aurora-active');
            } else if(type === 'rain') {
                // Placeholder for rain logic
                alert("Rain Effect Activated");
            } else if(type === 'particles') {
                // Placeholder for particle logic
                alert("Particles Activated");
            }
        }

        function filterGames(query) {
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query.toLowerCase()) ? 'block' : 'none';
            });
        }

        // Auto Cloak and Settings Load
        window.onload = function() {
            const cloakType = localStorage.getItem('autoCloak');
            if (cloakType === 'about:blank' && !window.name.includes('cloaked')) {
                const win = window.open('about:blank', '_blank');
                if (win) {
                    win.name = 'cloaked';
                    const iframe = win.document.createElement('iframe');
                    iframe.style = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;margin:0;padding:0;";
                    iframe.src = window.location.href;
                    win.document.body.appendChild(iframe);
                    window.location.replace('https://google.com');
                }
            }
        };
    </script>
</body>
</html>
