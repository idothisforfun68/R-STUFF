<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: white;
            /* Aurora Borealis Background */
            background: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Header: Time and Weather */
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Main Content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #ffffff, #94d2bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(148, 210, 189, 0.6));
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        /* Game Buttons Group */
        .button-group {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .app-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .app-btn:hover {
            background: rgba(148, 210, 189, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Discord Button Bottom Left */
        .discord-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: #5865F2;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .discord-btn:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="clock">00:00:00 AM</span> | <span id="weather">Loading Weather...</span>
    </div>

    <div class="container">
        <h1>ProjectNEON</h1>
        <p class="tagline">handle with extreme care</p>

        <div class="button-group">
            <a href="play.html" class="app-btn">Games</a>
            <a href="apps.html" class="app-btn">Apps</a>
            <a href="settings.html" class="app-btn">Settings</a>
        </div>
    </div>

    <a href="YOUR_DISCORD_INVITE_LINK_HERE" class="discord-btn" target="_blank">
        <i class="fa-brands fa-discord"></i>
    </a>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerHTML = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simple Weather (Static Location or API)
        // Note: For a real live location weather, you'd need an API key. 
        // This shows a mock temp to match your screenshot style.
        async function fetchWeather() {
            // Using a public free API for example
            try {
                // Defaulting to 50°F to match your screenshot style
                document.getElementById('weather').innerHTML = "50°F";
            } catch (e) {
                document.getElementById('weather').innerHTML = "Weather Unavailable";
            }
        }
        fetchWeather();
    </script>
</body>
</html>
