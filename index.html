<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | ProjectNEON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Effect Layers */
        #effect-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .aurora-active { animation: aurora 15s ease infinite; }
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: #94d2bd; text-decoration: none; cursor: pointer; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-weight: 500; cursor: pointer; }
        .nav-links a:hover { color: white; }

        /* Home View Dashboard */
        #home-view {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: calc(100vh - 80px); text-align: center;
        }
        .time-weather { font-size: 1.2rem; margin-bottom: 20px; font-weight: 300; opacity: 0.9; }
        .main-title { font-size: 5rem; font-weight: 800; margin: 0; letter-spacing: -2px; }
        .main-subtitle { font-size: 1.2rem; opacity: 0.6; margin-top: 10px; margin-bottom: 30px; }

        /* Shared Search bar style */
        .search-container { width: 100%; max-width: 600px; position: relative; margin: 0 auto; }
        .search-container input {
            width: 100%; padding: 15px 50px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 1rem; transition: 0.3s;
        }
        .search-container input:focus { background: rgba(255,255,255,0.2); border-color: #94d2bd; }
        .search-container i { position: absolute; left: 20px; top: 18px; opacity: 0.5; }

        /* Games View */
        #games-view { display: none; padding: 40px 20px; height: calc(100vh - 80px); overflow-y: auto; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; }
        .game-card { 
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; text-decoration: none; color: white;
        }
        .game-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); border-color: #94d2bd; }

        /* Discord Button */
        .discord-btn {
            position: fixed; bottom: 30px; left: 30px;
            background: #5865F2; color: white; padding: 15px 25px;
            border-radius: 15px; text-decoration: none; font-weight: 600;
            display: flex; align-items: center; gap: 10px; font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s; z-index: 100;
        }
        .discord-btn:hover { transform: scale(1.05); background: #4752c4; }

        /* Effects Panel */
        .effects-panel { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 10px; z-index: 100; }
        .effect-toggle {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .effect-toggle.active { background: #94d2bd; color: #001219; border-color: #94d2bd; font-weight: 700; }
    </style>
</head>
<body class="aurora-active">

    <canvas id="effect-canvas"></canvas>

    <nav>
        <a onclick="showView('home')" class="logo">ProjectNEON</a>
        <div class="nav-links">
            <a onclick="showView('home')"><i class="fa-solid fa-house"></i> Home</a>
            <a onclick="showView('games')">Games</a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </nav>

    <div id="home-view">
        <div class="time-weather" id="display-info">00:00 AM | 46°F</div>
        <h1 class="main-title">ProjectNEON <span style="font-weight: 300; opacity: 0.8;">v4</span></h1>
        <p class="main-subtitle">Oscar REALLY made this site so hop off Brantley</p>
        
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search for a game..." onfocus="showView('games')" onkeyup="filterGames(this.value)">
        </div>
    </div>

    <div id="games-view">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="gameSearchInput" placeholder="Search games..." onkeyup="filterGames(this.value)">
        </div>
        <div class="game-grid" id="gameGrid">
            <a href="#" class="game-card"><span>Example Game 1</span></a>
            <a href="#" class="game-card"><span>Example Game 2</span></a>
            <a href="#" class="game-card"><span>Example Game 3</span></a>
        </div>
    </div>

    <a href="https://discord.gg/6A9Z2KJM" target="_blank" class="discord-btn">
        <i class="fa-brands fa-discord"></i> Discord
    </a>

    <div class="effects-panel">
        <button id="btn-aurora" class="effect-toggle active" onclick="setEffect('aurora')">Activate Aurora</button>
        <button id="btn-rain" class="effect-toggle" onclick="setEffect('rain')">Activate Rain</button>
        <button id="btn-particles" class="effect-toggle" onclick="setEffect('particles')">Activate Particles</button>
    </div>

    <script>
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let particles = [];
        let currentEffect = 'aurora';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function showView(view) {
            document.getElementById('home-view').style.display = view === 'home' ? 'flex' : 'none';
            document.getElementById('games-view').style.display = view === 'games' ? 'block' : 'none';
            if(view === 'games') document.getElementById('gameSearchInput').focus();
        }

        function updateStatus() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('display-info').innerText = `${timeStr} | 46°F`;
        }
        setInterval(updateStatus, 1000);
        updateStatus();

        // Background Effect Logic
        function setEffect(type) {
            // Deactivate all first
            document.body.classList.remove('aurora-active');
            cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.querySelectorAll('.effect-toggle').forEach(b => b.classList.remove('active'));

            if (currentEffect === type && type !== 'aurora') {
                // If clicking the same one, revert to default aurora
                currentEffect = 'aurora';
                document.body.classList.add('aurora-active');
                document.getElementById('btn-aurora').classList.add('active');
                return;
            }

            currentEffect = type;
            document.getElementById(`btn-${type}`).classList.add('active');

            if (type === 'aurora') {
                document.body.classList.add('aurora-active');
            } else if (type === 'rain') {
                initRain();
            } else if (type === 'particles') {
                initParticles();
            }
        }

        // Rain Logic
        function initRain() {
            particles = [];
            for(let i = 0; i < 100; i++) {
                particles.push({x: Math.random() * canvas.width, y: Math.random() * canvas.height, l: Math.random() * 20, v: Math.random() * 10 + 5});
            }
            drawRain();
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(174,194,224,0.5)';
            ctx.lineWidth = 1;
            particles.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x, p.y + p.l);
                ctx.stroke();
                p.y += p.v;
                if(p.y > canvas.height) p.y = -p.l;
            });
            animationId = requestAnimationFrame(drawRain);
        }

        // Particle Logic
        function initParticles() {
            particles = [];
            for(let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width, 
                    y: Math.random() * canvas.height, 
                    r: Math.random() * 3 + 1, 
                    dx: (Math.random() - 0.5) * 2, 
                    dy: (Math.random() - 0.5) * 2
                });
            }
            drawParticles();
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(148, 210, 189, 0.5)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.dx; p.y += p.dy;
                if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            animationId = requestAnimationFrame(drawParticles);
        }

        function filterGames(query) {
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query.toLowerCase()) ? 'block' : 'none';
            });
        }

        window.onload = function() {
            // Apply Theme from settings
            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                const themes = {
                    original: 'linear-gradient(130deg, #001219 0%, #005f73 25%, #0a9396 50%, #94d2bd 75%, #001219 100%)',
                    amethyst: 'linear-gradient(130deg, #240046 0%, #3c096c 25%, #5a189a 50%, #7b2cbf 75%, #240046 100%)',
                    amoled: 'linear-gradient(130deg, #000000 0%, #050505 50%, #111111 100%)'
                    // ... other themes
                };
                if(themes[savedTheme]) document.body.style.background = themes[savedTheme];
            }
        };
    </script>
</body>
</html>
