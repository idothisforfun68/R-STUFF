<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Credits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: black; color: white; margin: 0; 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; 
        }
        
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        #fps-counter { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 20; }

        /* Navigation & Clock */
        .top-nav-container { position: fixed; top: 30px; display: flex; align-items: center; gap: 25px; z-index: 100; }
        .clock-box { 
            background: rgba(255,255,255,0.15); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 24px; backdrop-filter: blur(10px);
        }
        .nav-dock { 
            background: rgba(255,255,255,0.15); padding: 15px 45px; border-radius: 60px; 
            display: flex; gap: 35px; font-size: 32px; backdrop-filter: blur(10px);
        }
        .nav-dock a { color: white; text-decoration: none; transition: 0.3s; }
        .nav-dock a:hover { transform: scale(1.2); color: #88ff88; }

        /* Credits Layout */
        .credits-wrapper {
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .credits-header {
            font-size: 48px;
            font-weight: bold;
            color: #88e0ff; /* Light blue from screenshot */
            margin-bottom: 20px;
        }

        /* The horizontal divider line with color gradient */
        .credits-divider {
            width: 80%;
            height: 4px;
            margin: 0 auto 40px auto;
            background: linear-gradient(to right, #88e0ff 0%, #88e0ff 75%, #ff8888 75%, #ff8888 100%);
            border-radius: 2px;
        }

        /* Horizontal Row for Profiles */
        .profile-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 0 40px;
            overflow-x: auto;
        }

        /* Placeholder boxes for PFP */
        .profile-placeholder {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px solid white;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #aaa;
            transition: 0.3s;
        }
        .profile-placeholder:hover {
            transform: scale(1.1);
            border-color: #88ff88;
        }

        /* Bottom Controls */
        .bottom-controls { position: fixed; bottom: 30px; left: 30px; display: flex; gap: 15px; z-index: 100; }
        .ctrl-btn { 
            width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: none; color: white; font-size: 24px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:hover { background: #88ff88; color: black; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-nav-container">
        <div class="clock-box" id="clock">00:00 PM</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html" style="color:#88ff88"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="credits-wrapper">
        <div class="credits-header">Credits</div>
        <div class="credits-divider"></div>
        
        <div class="profile-row">
            <div class="profile-placeholder">Member 1</div>
            <div class="profile-placeholder">Member 2</div>
            <div class="profile-placeholder">Member 3</div>
            <div class="profile-placeholder">Member 4</div>
            <div class="profile-placeholder">Member 5</div>
            <div class="profile-placeholder">Member 6</div>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="ctrl-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="ctrl-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="ctrl-btn"><i class="fa-solid fa-comment"></i></button>
    </div>

    <script>
        // FPS & Clock Stats
        let lastTime = performance.now();
        function updateStats() {
            const now = performance.now();
            document.getElementById('fps-counter').innerText = "FPS: " + Math.round(1000 / (now - lastTime));
            lastTime = now;
            
            const d = new Date();
            let h = d.getHours() % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${String(d.getMinutes()).padStart(2, '0')} ${d.getHours()>=12?'PM':'AM'}`;
            requestAnimationFrame(updateStats);
        }
        updateStats();

        // Background Particles
        const sCanvas = document.getElementById('stars');
        sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight;
        const sCtx = sCanvas.getContext('2d');
        let stars = [];
        for(let i=0; i<150; i++) stars.push({x: Math.random()*sCanvas.width, y: Math.random()*sCanvas.height, s: Math.random()*1.5});

        function animateStars() {
            sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
            sCtx.fillStyle = 'white';
            stars.forEach(s => {
                s.y += 0.2; if(s.y > sCanvas.height) s.y = 0;
                sCtx.beginPath(); sCtx.arc(s.x, s.y, s.s, 0, Math.PI*2); sCtx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();
    </script>
</body>
</html>
