<!DOCTYPE html>
<html>
<head>
    <title>Credits - R-STUFF</title>
    <link rel="stylesheet" href="config/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: black; color: white; margin: 0; font-family: sans-serif;">

    <div class="top-bar" style="display: flex; justify-content: center; align-items: center; width: 100%; padding: 30px 0; gap: 20px;">
        <div id="clock" style="background: rgba(255,255,255,0.1); padding: 18px 35px; border-radius: 15px; font-weight: 900; font-size: 28px; min-width: 120px; text-align: center;">--:-- --</div>
        <div class="nav-dock" style="background: rgba(255,255,255,0.1); padding: 18px 40px; border-radius: 60px; display: flex; gap: 30px; font-size: 28px;">
            <a href="index.html" style="color: white;"><i class="fa-solid fa-house"></i></a>
            <a href="play.html" style="color: white;"><i class="fa-solid fa-gamepad"></i></a>
            <i class="fa-solid fa-border-all"></i>
            <i class="fa-solid fa-gear"></i>
            <a href="credits.html" style="color: white;"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div style="text-align: center; margin-top: 50px;">
        <h1 style="font-size: 80px; font-family: 'Arial Black';">CREDITS</h1>
        <p style="font-size: 24px; color: #888;">Created by Oscar 🌮</p>
        <div style="background: rgba(255,255,255,0.05); display: inline-block; padding: 40px; border-radius: 20px; margin-top: 20px;">
            <p>Code Help: Gemini AI</p>
            <p>Design Inspiration: K-STUFF</p>
        </div>
    </div>

    </body>
    <script>
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12; 
        document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</html>
