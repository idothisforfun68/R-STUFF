<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-STUFF | Credits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: black; color: white; margin: 0; 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; 
        }
        
        #stars, #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        #fps-counter { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 20; }

        /* Navigation & Clock */
        .top-nav-container { position: fixed; top: 30px; display: flex; align-items: center; gap: 25px; z-index: 100; }
        .clock-box { 
            background: rgba(255,255,255,0.15); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 24px; backdrop-filter: blur(10px);
        }
        .nav-dock { 
            background: rgba(255,255,255,0.15); padding: 15px 45px; border-radius: 60px; 
            display: flex; gap: 35px; font-size: 32px; backdrop-filter: blur(10px);
        }
        .nav-dock a { color: white; text-decoration: none; transition: 0.3s; }
        .nav-dock a:hover { transform: scale(1.2); color: #88ff88; }

        /* Credits Layout */
        .credits-wrapper { width: 100%; text-align: center; z-index: 10; }
        .credits-header { font-size: 48px; font-weight: bold; color: #88e0ff; margin-bottom: 20px; }

        .credits-divider {
            width: 80%; height: 4px; margin: 0 auto 40px auto;
            background: linear-gradient(to right, #88e0ff 0%, #88e0ff 75%, #ff8888 75%, #ff8888 100%);
            border-radius: 2px;
        }

        .profile-row { display: flex; justify-content: center; gap: 20px; padding: 0 40px; }

        /* Member Card Styling */
        .profile-card {
            width: 120px; height: 120px; border-radius: 15px; border: 2px solid white;
            flex-shrink: 0; overflow: hidden; cursor: pointer; transition: 0.3s;
            background: rgba(255, 255, 255, 0.1); position: relative;
        }
        .profile-card img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover { transform: scale(1.1); border-color: #88ff88; box-shadow: 0 0 15px #88ff88; }

        /* Enlarged & Draggable Info Card */
        .overlay-card {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 550px; background: #111; border-radius: 20px; border: 1px solid #333;
            padding: 30px; z-index: 200; display: none; text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            cursor: default;
        }
        .card-header { 
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px; 
            cursor: move; 
            user-select: none;
        }
        .card-pfp { width: 80px; height: 80px; border-radius: 12px; border: 2px solid #555; }
        .card-name { font-size: 24px; font-weight: bold; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .close-card { font-size: 28px; cursor: pointer; color: #777; transition: 0.3s; }
        .close-card:hover { color: white; }
        .card-desc { font-size: 18px; color: #ccc; line-height: 1.6; border-top: 1px solid #222; padding-top: 20px; }

        /* Bottom Controls */
        .bottom-controls { position: fixed; bottom: 30px; left: 30px; display: flex; gap: 15px; z-index: 100; }
        .ctrl-btn { 
            width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: none; color: white; font-size: 24px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:hover { background: #88ff88; color: black; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>

    <div class="top-nav-container">
        <div class="clock-box" id="clock">00:00 PM</div>
        <div class="nav-dock">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
            <a href="play.html"><i class="fa-solid fa-gamepad"></i></a>
            <a href="#"><i class="fa-solid fa-border-all"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <a href="credits.html" style="color:#88ff88"><i class="fa-solid fa-credit-card"></i></a>
        </div>
    </div>

    <div class="credits-wrapper">
        <div class="credits-header">Credits</div>
        <div class="credits-divider"></div>
        
        <div class="profile-row">
            <div class="profile-card" onclick="openInfo('owner')">
                <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWU3aHN6MG9kc3BtZXoyYWc1bjg4MXJubW0xeTlvdjNucnNnOTNnYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LHlbHhUamxFxo5F878/giphy.gif" alt="PFP">
            </div>

            <div class="profile-card" onclick="openInfo('cookie')">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3NwbGF6bzk4NXg5bmJ5dGtrb2d6d2RtN2N3d2liOGNqOWJkZnZiMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/DzcTpJFqKQo1M7eqK0/giphy.gif" alt="PFP">
            </div>

            <div class="profile-card" onclick="openInfo('simba')">
                <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWU3aHN6MG9kc3BtZXoyYWc1bjg4MXJubW0xeTlvdjNucnNnOTNnYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/901mxGLGQN2PyCQpoc/giphy.gif" alt="PFP">
            </div>

            <div class="profile-card" onclick="openInfo('rylee')">
                <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWJrM2Z3YjVrZXljcGRjcnJ6cnk2Z25tYm96azVuZ215Y29ua2Q1MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wKJSRY2OgYx2m6R4oA/giphy.gif" alt="PFP">
            </div>
        </div>
    </div>

    <div class="overlay-card" id="infoCard">
        <div class="card-header" id="dragHandle">
            <img class="card-pfp" id="displayPfp" src="">
            <div class="card-name" id="displayName">NAME</div>
            <div class="close-card" onclick="closeInfo()">&times;</div>
        </div>
        <div class="card-desc" id="displayDesc">
            DESCRIPTION
        </div>
    </div>

    <div class="bottom-controls">
        <button class="ctrl-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="ctrl-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="ctrl-btn"><i class="fa-solid fa-comment"></i></button>
    </div>

    <script>
        const memberData = {
            'owner': {
                name: "I TEST FOR PEOPLE",
                pfp: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWU3aHN6MG9kc3BtZXoyYWc1bjg4MXJubW0xeTlvdjNucnNnOTNnYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LHlbHhUamxFxo5F878/giphy.gif",
                desc: "Owner of R-STUFF, inspired by: K-STUFF/.˚⭒⋆~𝓒𝓞𝓞𝓚𝓘𝓔~⋆⭒˚. Tester and game adder for K-STUFF"
            },
            'cookie': {
                name: ".˚⭒⋆~𝓒𝓞𝓞𝓚𝓘𝓔~⋆⭒˚.",
                pfp: "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3NwbGF6bzk4NXg5bmJ5dGtrb2d6d2RtN2N3d2liOGNqOWJkZnZiMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/DzcTpJFqKQo1M7eqK0/giphy.gif",
                desc: "He inspired me into making my unblocked games which is R-STUFF"
            },
            'simba': {
                name: "simba",
                pfp: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWU3aHN6MG9kc3BtZXoyYWc1bjg4MXJubW0xeTlvdjNucnNnOTNnYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/901mxGLGQN2PyCQpoc/giphy.gif",
                desc: "Im always mean to everyone also I TEST FOR PEOPLE, can you pull a juice wrld?"
            },
            'rylee': {
                name: "RyleeRyleeRyleeRyleeRylee",
                pfp: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWJrM2Z3YjVrZXljcGRjcnJ6cnk2Z25tYm96azVuZ215Y29ua2Q1MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wKJSRY2OgYx2m6R4oA/giphy.gif",
                desc: "Ryder is ass at elden ring"
            }
        };

        function openInfo(memberKey) { 
            const data = memberData[memberKey];
            document.getElementById('displayName').innerText = data.name;
            document.getElementById('displayPfp').src = data.pfp;
            document.getElementById('displayDesc').innerText = data.desc;

            const card = document.getElementById('infoCard');
            card.style.display = 'block'; 
            card.style.top = "50%";
            card.style.left = "50%";
            card.style.transform = "translate(-50%, -50%)";
        }

        function closeInfo() { document.getElementById('infoCard').style.display = 'none'; }

        // Draggable Logic
        const card = document.getElementById("infoCard");
        const handle = document.getElementById("dragHandle");
        let isDragging = false;
        let offsetX, offsetY;

        handle.addEventListener("mousedown", (e) => {
            isDragging = true;
            const rect = card.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            card.style.transform = "none";
            card.style.left = rect.left + "px";
            card.style.top = rect.top + "px";
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            card.style.left = (e.clientX - offsetX) + "px";
            card.style.top = (e.clientY - offsetY) + "px";
        });

        document.addEventListener("mouseup", () => { isDragging = false; });

        // Clock & FPS
        let lastTime = performance.now();
        function updateStats() {
            const now = performance.now();
            document.getElementById('fps-counter').innerText = "FPS: " + Math.round(1000 / (now - lastTime));
            lastTime = now;
            const d = new Date();
            let h = d.getHours() % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${String(d.getMinutes()).padStart(2, '0')} ${d.getHours()>=12?'PM':'AM'}`;
            requestAnimationFrame(updateStats);
        }
        updateStats();

        // Particles
        const sCanvas = document.getElementById('stars');
        sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight;
        const sCtx = sCanvas.getContext('2d');
        let stars = [];
        for(let i=0; i<150; i++) stars.push({x: Math.random()*sCanvas.width, y: Math.random()*sCanvas.height, s: Math.random()*1.5});
        function animateStars() {
            sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
            sCtx.fillStyle = 'white';
            stars.forEach(s => { s.y += 0.2; if(s.y > sCanvas.height) s.y = 0; sCtx.beginPath(); sCtx.arc(s.x, s.y, s.s, 0, Math.PI*2); sCtx.fill(); });
            requestAnimationFrame(animateStars);
        }
        animateStars();
    </script>
</body>
    <div id="browser-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; padding:20px; box-sizing:border-box;">
    <div id="browser-window" style="width:100%; height:100%; background:#1a1b1e; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; border: 1px solid #333; position:relative;">
        
        <div style="background:#25262b; padding:10px; display:flex; gap:10px; align-items:center; border-bottom: 1px solid #333;">
            <div id="tabs-container" style="display:flex; gap:5px;">
                <div class="active-tab" style="background:#3d3e42; color:white; padding:5px 15px; border-radius:8px 8px 0 0; font-size:12px; cursor:pointer;">Tab 1</div>
            </div>
            <button onclick="addNewTab()" style="background:#3d3e42; border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;"><i class="fa-solid fa-plus"></i></button>
            
            <input type="text" id="browser-url" placeholder="Search or enter URL" style="flex-grow:1; background:#1a1b1e; border:1px solid #3d3e42; color:white; padding:8px 15px; border-radius:20px; outline:none; margin-left:10px;">
            
            <button onclick="addBookmark()" style="background:none; border:none; color:#777; font-size:18px; cursor:pointer;"><i class="fa-solid fa-bookmark"></i></button>
            <button onclick="toggleFullscreen()" style="background:none; border:none; color:#777; font-size:18px; cursor:pointer;"><i class="fa-solid fa-expand"></i></button>
            <button onclick="closeBrowser()" style="background:#ff5f56; border:none; width:15px; height:15px; border-radius:50%; cursor:pointer; margin-left:10px;"></button>
        </div>

        <div style="flex-grow:1; position:relative; background:#1a1b1e;">
            <div id="browser-clock" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:rgba(255,255,255,0.2); font-size:120px; font-weight:bold; pointer-events:none; font-family: sans-serif; display: flex; align-items: baseline; gap: 10px;">
                <span id="b-time">00:00</span>
                <span id="b-ampm" style="font-size:30px;">PM</span>
            </div>
            
            <iframe id="browser-frame" src="about:blank" style="width:100%; height:100%; border:none; background:white; position:relative; z-index:1;"></iframe>
        </div>
    </div>
</div>

<div onclick="toggleBrowser()" style="position:fixed; bottom:20px; right:20px; background:#4a4e57; color:white; padding:10px 20px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:10px; z-index:9999; font-weight:bold; font-family:sans-serif; border: 1px solid #666;">
    <i class="fa-solid fa-globe"></i> Browse
</div>

<script>
let isFullscreen = false;

function toggleBrowser() {
    const overlay = document.getElementById('browser-overlay');
    overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
}

function closeBrowser() {
    document.getElementById('browser-overlay').style.display = 'none';
}

function navigateBrowser() {
    let url = document.getElementById('browser-url').value;
    if (!url.startsWith('http')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
    }
    document.getElementById('browser-frame').src = url;
    // Hide clock when a site is loaded
    document.getElementById('browser-clock').style.display = 'none';
}

function addNewTab() {
    // Basic tab visual reset
    document.getElementById('browser-frame').src = 'about:blank';
    document.getElementById('browser-url').value = '';
    document.getElementById('browser-clock').style.display = 'flex';
}

function addBookmark() {
    const url = document.getElementById('browser-url').value;
    if(url) alert("Bookmarked: " + url);
}

function toggleFullscreen() {
    const elem = document.getElementById("browser-window");
    if (!isFullscreen) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        isFullscreen = true;
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        isFullscreen = false;
    }
}

// Internal Browser Clock Logic
function updateBrowserClock() {
    const d = new Date();
    let h = d.getHours() % 12 || 12;
    let m = String(d.getMinutes()).padStart(2, '0');
    let ampm = d.getHours() >= 12 ? 'PM' : 'AM';
    document.getElementById('b-time').innerText = `${h}:${m}`;
    document.getElementById('b-ampm').innerText = ampm;
}
setInterval(updateBrowserClock, 1000);
updateBrowserClock();

document.getElementById('browser-url').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') navigateBrowser();
});
</script>
</html>
